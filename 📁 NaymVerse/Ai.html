<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaymVerse AI Tools</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="ai.html">AI Tools</a>
  </nav>
</header>

<section class="hero">
  <h1>NaymVerse AI Chatbot</h1>
  <p>Free 3 messages. Subscribe for unlimited use.</p>
</section>

<div class="chatbot" onclick="toggleChat()">💬</div>

<div id="chatBox" style="display:none; position:fixed; bottom:80px; right:20px; width:300px; height:400px; background:#fff; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.3); z-index:1000; flex-direction:column; overflow:hidden;">
  <div style="background:#007bff; color:#fff; padding:10px; text-align:center; font-weight:bold;">NaymVerse AI Chat</div>
  <div id="chatMessages" style="flex:1; padding:10px; overflow-y:auto; background:#f0f0f0;"></div>
  <div style="display:flex; padding:10px; gap:5px;">
    <input id="chatInput" type="text" placeholder="Type your message..." style="flex:1; padding:5px;">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
